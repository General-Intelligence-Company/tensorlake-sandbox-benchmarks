[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sandbox-bench"
version = "0.1.0"
description = "Scripted sandbox lifecycle, filesystem, browser and S3 benchmarks"
requires-python = ">=3.11,<3.14"
dependencies = ["httpx>=0.27,<1", "boto3>=1.35,<2"]

[project.optional-dependencies]
tensorlake = ["tensorlake==0.5.158"]
modal = ["modal==1.6.2"]
blaxel = ["blaxel==0.4.19"]
beam = ["beam-client==0.2.233", "beta9==0.1.291"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
sandbox-bench = "sandbox_bench.cli:main"

[tool.setuptools]
packages = ["sandbox_bench"]

[tool.setuptools.data-files]
"share/sandbox-bench/context" = ["context/manifest.example.json", "context/sandbox_workload.py", "context/run_sandbox_workload.py", "context/record_resource_usage.py", "context/shared-app.bundle"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
